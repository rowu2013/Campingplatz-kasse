<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Campingplatz-Kasse</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8;color:#17202a}header{background:#173b2b;color:#fff;padding:16px}main{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.btn{border:0;border-radius:12px;padding:16px;font-size:16px;cursor:pointer;background:#fff;box-shadow:0 2px 8px #0002}.primary{background:#173b2b;color:#fff}.danger{background:#a33;color:#fff}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 8px #0001}input{padding:12px;border:1px solid #bbb;border-radius:8px;margin:4px;width:calc(100% - 32px)}label{display:block;margin-top:8px;font-weight:bold}.hidden{display:none}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1;min-width:120px}.cart{border-top:1px solid #ddd;margin-top:12px;padding-top:12px}.item{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}.small{font-size:13px;color:#666}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e7eee9;margin:2px}.total{font-size:24px;font-weight:bold;text-align:right}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:16px}.modalbox{background:white;border-radius:16px;padding:20px;max-width:600px;width:100%}video{width:100%;border-radius:10px}</style></head><body><header><h1>🏕️ Campingplatz-Kasse</h1><div id="session"></div></header><main><section id="login" class="card"><h2>Anmeldung</h2><input id="pin" type="password" inputmode="numeric" placeholder="PIN"><button class="btn primary" onclick="login()">Anmelden</button><p class="small">Demo: Mitarbeiter 1234 · Chef 9999</p></section><section id="app" class="hidden"><div class="card"><div class="row"><input id="site" placeholder="Stellplatz (optional)"><input id="barcode" placeholder="Barcode eingeben"><button class="btn" onclick="findBarcode()">🔎 Suchen</button><button class="btn" onclick="scan()">📷 Scannen</button></div></div><div id="tabs" class="grid"></div><div id="content"></div><div class="card"><h2>🧾 Aktueller Bon</h2><div id="cart"></div><div class="total" id="total">0,00 €</div><button class="btn primary" onclick="checkout()">💶 Direkt verkaufen</button><button class="btn" onclick="clearCart()">Leeren</button></div><button class="btn danger" onclick="logout()">🔒 Abmelden</button></section></main><div id="modal" class="hidden"></div><script>
const chefPin='9999';let user=null,cart=[];const employees=()=>JSON.parse(localStorage.getItem('employees')||'[{"name":"Mitarbeiter","pin":"1234"}]');const articles=()=>JSON.parse(localStorage.getItem('articles')||'[]');
function money(n){return n.toFixed(2).replace('.',',')+' €'} function save(k,v){localStorage.setItem(k,JSON.stringify(v))} function login(){let p=document.getElementById('pin').value;if(p===chefPin){user={name:'Chef',chef:true}}else{let e=employees().find(x=>x.pin===p);if(e)user={...e,chef:false}}if(!user)return alert('PIN nicht gefunden.');document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('session').textContent='Angemeldet: '+user.name;buildTabs();show('camping')}function logout(){location.reload()}
function buildTabs(){let t=[['camping','🏕️ Camping'],['check','📋 Check-in / Check-out'],['shower','🚿 Duschmünzen'],['roll','🥐 Brötchen'],['extra','➕ Extra']];if(user.chef)t.push(['chef','👑 Chef-Menü']);document.getElementById('tabs').innerHTML=t.map(x=>`<button class="btn" onclick="show('${x[0]}')">${x[1]}</button>`).join('')}
function show(tab){let c=document.getElementById('content');if(tab==='camping')c.innerHTML='<div class="card"><h2>🏕️ Camping</h2><p>Artikel direkt verkaufen oder einem Stellplatz zuordnen.</p></div>';if(tab==='check')c.innerHTML='<div class="card"><h2>📋 Check-in / Check-out</h2><input id="guest" placeholder="Gastname"><input id="checksite" placeholder="Stellplatz"><div class="row"><button class="btn primary" onclick="checkin()">Check-in</button><button class="btn" onclick="checkoutSite()">Check-out</button></div><div id="stays"></div></div>';if(tab==='shower')c.innerHTML='<div class="card"><h2>🚿 Duschmünzen</h2><p>Duschmünzen werden als Pfandartikel geführt.</p><div class="row"><button class="btn" onclick="add('Duschmünze Ausgabe',1)">Münze ausgeben – 1,00 €</button><button class="btn" onclick="add('Duschmünze Rückgabe',-1)">Münze zurückgeben – 1,00 €</button></div></div>';if(tab==='roll')listArticles(true);if(tab==='extra')listArticles(false);if(tab==='chef')chef();updateCart()}
function listArticles(bread){let a=articles().filter(x=>!!x.bread===bread);document.getElementById('content').innerHTML='<div class="card"><h2>'+ (bread?'🥐 Brötchen':'➕ Extra')+'</h2>'+ (a.length?a.map(x=>`<button class="btn" onclick='add(${JSON.stringify(x.name)},${x.price})'>${x.name}<br><b>${money(x.price)}</b></button>`).join(' '):'<p>Noch keine Artikel angelegt.</p>')+'</div>'}
function add(name,price){cart.push({name,price,site:document.getElementById('site').value.trim()});updateCart()}function updateCart(){document.getElementById('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="item"><span>${x.name} ${x.site?'<span class="pill">Stellplatz '+x.site+'</span>':''}</span><span>${money(x.price)} <button onclick="cart.splice(${i},1);updateCart()">✕</button></span></div>`).join(''):'<p class="small">Noch nichts im Bon.</p>';document.getElementById('total').textContent=money(cart.reduce((s,x)=>s+x.price,0))}
function checkout(){if(!cart.length)return alert('Der Bon ist leer.');let total=cart.reduce((s,x)=>s+x.price,0);let d=new Date().toISOString().slice(0,10);let sales=JSON.parse(localStorage.getItem('sales')||'[]');sales.push({date:d,total,items:cart});save('sales',sales);alert('Verkauf gebucht: '+money(total));cart=[];updateCart()}
function clearCart(){cart=[];updateCart()}function findBarcode(){let b=document.getElementById('barcode').value.trim();let a=articles().find(x=>x.barcode===b);if(a)add(a.name,a.price);else alert('Barcode nicht gefunden.')}
function chef(){let a=articles();let s=JSON.parse(localStorage.getItem('sales')||'[]'),today=new Date().toISOString().slice(0,10),turn=s.filter(x=>x.date===today).reduce((n,x)=>n+x.total,0);document.getElementById('content').innerHTML=`<div class="card"><h2>👑 Chef-Menü</h2><h3>Artikel anlegen</h3><label>Name:</label><input id="an"><label>Preis:</label><input id="ap" type="number" step="0.01"><label>Barcode:</label><input id="ab"><label><input id="abr" type="checkbox" style="width:auto"> Zum Brötchen-Button hinzufügen</label><button class="btn primary" onclick="saveArticle()">Artikel speichern</button><h3>Artikel</h3>${a.map((x,i)=>`<div class="item"><span>${x.name} – ${money(x.price)} <span class="pill">${x.bread?'Brötchen':'Extra'}</span></span><button onclick="delArticle(${i})">Löschen</button></div>`).join('')||'<p>Keine Artikel.</p>'}<h3>Heute</h3><p><b>Tagesumsatz: ${money(turn)}</b></p><h3>Mitarbeiter</h3><input id="en" placeholder="Name"><input id="ep" placeholder="PIN"><button class="btn" onclick="addEmployee()">Mitarbeiter hinzufügen</button><div>${employees().map((e,i)=>`<div class="item">${e.name} (${e.pin}) <button onclick="delEmployee(${i})">Löschen</button></div>`).join('')}</div></div>`}
function saveArticle(){let name=document.getElementById('an').value.trim(),price=Number(document.getElementById('ap').value),barcode=document.getElementById('ab').value.trim(),bread=document.getElementById('abr').checked;if(!name||!price)return alert('Name und Preis ausfüllen.');let a=articles();a.push({name,price,barcode,bread});save('articles',a);chef()}function delArticle(i){let a=articles();a.splice(i,1);save('articles',a);chef()}function addEmployee(){let n=document.getElementById('en').value.trim(),p=document.getElementById('ep').value.trim();if(!n||!p)return;let e=employees();e.push({name:n,pin:p});save('employees',e);chef()}function delEmployee(i){let e=employees();e.splice(i,1);save('employees',e);chef()}
function checkin(){let n=document.getElementById('guest').value.trim(),s=document.getElementById('checksite').value.trim();if(!n||!s)return alert('Gast und Stellplatz eingeben.');let x=JSON.parse(localStorage.getItem('stays')||'[]');x.push({name:n,site:s,in:new Date().toLocaleString('de-DE')});save('stays',x);renderStays()}function checkoutSite(){let s=document.getElementById('checksite').value.trim(),x=JSON.parse(localStorage.getItem('stays')||'[]'),i=x.findIndex(v=>v.site===s);if(i<0)return alert('Stellplatz nicht gefunden.');x.splice(i,1);save('stays',x);renderStays();alert('Check-out für Stellplatz '+s+' durchgeführt.')}function renderStays(){let el=document.getElementById('stays');if(!el)return;let x=JSON.parse(localStorage.getItem('stays')||'[]');el.innerHTML='<h3>Belegte Stellplätze</h3>'+x.map(v=>`<div class="item">${v.site} – ${v.name}</div>`).join('')||'<p>Keine.</p>'}
async function scan(){if(!('BarcodeDetector'in window)){alert('Kamera-Barcode-Scan wird von diesem Browser nicht unterstützt. Bitte Barcode oben eingeben.');return}let md=document.getElementById('modal');md.className='modal';md.innerHTML='<div class="modalbox"><h2>📷 Barcode scannen</h2><video id="video" autoplay playsinline></video><button class="btn" onclick="closeScan()">Schließen</button></div>';let v=document.getElementById('video');try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});v.srcObject=stream;let d=new BarcodeDetector();let loop=async()=>{if(md.className==='hidden')return;try{let r=await d.detect(v);if(r.length){document.getElementById('barcode').value=r[0].rawValue;stream.getTracks().forEach(t=>t.stop());closeScan();findBarcode();return}}catch(e){}requestAnimationFrame(loop)};loop()}catch(e){alert('Kamera konnte nicht geöffnet werden.')} }function closeScan(){document.getElementById('modal').className='hidden';document.getElementById('modal').innerHTML=''}
</script></body></html>
